
spring.application.name=propertymatch

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/propertymatch_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:PropertyMatchLocalDevSecretKey2026AtLeast32Bytes}

# Local Property Image Storage
app.upload.dir=uploads

# Multipart Upload Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=45MB
