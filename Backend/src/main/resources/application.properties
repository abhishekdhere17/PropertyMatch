spring.application.name=propertymatch-backend
server.port=8080

# Create the database first in phpMyAdmin using database/propertymatch.sql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/propertymatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local image uploads will be configured in a later step; imageUrl currently stores a URL/path.
